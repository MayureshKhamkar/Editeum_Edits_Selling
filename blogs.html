{% extends 'base.html' %}

{% block content %}

<style>
    body {
        background-color: black;
        color: white;
        font-family: 'Poppins', sans-serif;
    }

    h2 {
        text-align: center;
        margin-top: 20px;
        color: lightcoral;
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .blog-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
        padding: 30px;
    }

    .blog-item {
        background: linear-gradient(135deg, #1e1e1e, #2a2a2a);
        border: 1px solid #555;
        border-radius: 15px;
        overflow: hidden;
        width: 90%;
        max-width: 900px;
        min-height: 200px;
        box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: row;
        gap: 20px;
        padding: 25px;
        align-items: center;
        transition: transform 0.4s ease-in-out, box-shadow 0.4s ease-in-out;
        cursor: pointer;
    }

    .blog-item:hover {
        transform: scale(1.05);
        box-shadow: 0px 10px 25px rgba(255, 99, 71, 0.5);
    }

    .blog-image {
        width: 170px;
        height: 170px;
        border-radius: 12px;
        object-fit: cover;
        background-color: #444;
        transition: transform 0.3s ease-in-out;
    }

    .blog-item:hover .blog-image {
        transform: scale(1.1);
    }

    .blog-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-right: 15px;
    }

    .blog-title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
        color: white;
        transition: color 0.3s;
    }

    .blog-item:hover .blog-title {
        color: lightcoral;
    }

    .blog-description {
        color: #ddd;
        font-size: 16px;
        line-height: 1.6;
        max-height: 3.5em;
        overflow: hidden;
    }

    .blog-meta {
        font-size: 14px;
        color: #aaa;
        margin-top: 10px;
    }

    .read-more {
        margin-top: 15px;
        padding: 10px 18px;
        background: lightcoral;
        color: white;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s ease-in-out, transform 0.3s ease-in-out;
    }

    .read-more:hover {
        background: #ff726f;
        transform: scale(1.1);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .blog-item {
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .blog-image {
            width: 100%;
            max-height: 220px;
        }
    }
</style>

<h2>Latest Editing Blogs</h2>

<section class="blog-container">
    {% for blog in blogs %}
    <div class="blog-item" onclick="window.location.href='/blog/{{ blog.id }}'">
        <img src="{{ blog.image_url }}" alt="Blog Image" class="blog-image">
        <div class="blog-content">
            <h3 class="blog-title">{{ blog.title }}</h3>
            <p class="blog-description">
                {{ blog.content[:150] }}...
            </p>
            <p class="blog-meta">Posted on {{ blog.created_at }}</p>
            <!-- <button class="read-more">Read More</button> -->
        </div>
    </div>
    {% endfor %}
</section>

{% endblock %}
