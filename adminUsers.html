<!-- adminUsers.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #121212;
            color: #fff;
        }
        .sidebar {
            width: 250px;
            position: fixed;
            height: 100%;
            background-color: #1e1e1e;
            padding-top: 20px;
        }
        .sidebar a {
            padding: 10px;
            text-decoration: none;
            font-size: 18px;
            color: #bbb;
            display: block;
        }
        .sidebar a:hover {
            background: #333;
            color: #fff;
        }
        .logout-btn {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .main-content {
            margin-left: 260px;
            padding: 20px;
        }
        table {
            width: 100%;
            background-color: #1e1e1e;
            color: #fff;
            border-radius: 10px;
            overflow: hidden;
        }
        th {
            background-color: #333;
            color: white;
            font-weight: bold;
            padding: 10px;
            text-align: left;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #444;
        }
        .btn-danger {
            background-color: red;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-danger:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin_users') }}">Manage Users</a>
        <a href="{{ url_for('admin_videos') }}">Manage Videos</a>
        <a href="{{ url_for('admin_transactions') }}">Transactions</a>
        <a href="{{ url_for('upload_blog') }}">Upload Blog</a>
        <a href="{{ url_for('admin_reviews') }}">Manage Reviews</a>
    </div>

    <div class="main-content">
        <a href="{{ url_for('admin_logout') }}" class="btn btn-danger logout-btn">Logout</a>
        <h2 class="text-center">Manage Users</h2>
        <table class="table mt-4">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Username</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.fullname }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.username }}</td>
                    <td>
                        <form action="{{ url_for('delete_user', user_id=user.id) }}" method="post" onsubmit="return confirm('Are you sure you want to delete this user?');">
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>                    
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
