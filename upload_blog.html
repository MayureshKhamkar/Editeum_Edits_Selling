<!-- adminBlogs.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Blogs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
        }
        .sidebar {
            width: 250px;
            position: fixed;
            height: 100%;
            background-color: #1e1e1e;
            padding-top: 20px;
        }
        .sidebar a {
            padding: 10px;
            text-decoration: none;
            font-size: 18px;
            color: #bbb;
            display: block;
        }
        .sidebar a:hover {
            background: #333;
            color: #fff;
        }
        .logout-btn {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .main-content {
            margin-left: 260px;
            padding: 20px;
        }
        .form-container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(255, 255, 255, 0.1);
            max-width: 600px;
            margin: auto;
        }
        .form-container h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #fff;
        }
        .form-container input,
        .form-container textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 16px;
            background-color: #2a2a2a;
            color: #fff;
        }
        .form-container button {
            width: 100%;
            padding: 10px;
            background-color: #f54141;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .form-container button:hover {
            background-color: #f73f3f;
        }
        .blog-table {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin: auto;
        }
        .blog-table h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #444;
            text-align: left;
        }
        th {
            background-color: #f54141;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #2a2a2a;
        }
        .delete-btn {
            background-color: #f54141;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .delete-btn:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin_users') }}">Manage Users</a>
        <a href="{{ url_for('admin_videos') }}">Manage Videos</a>
        <a href="{{ url_for('admin_transactions') }}">Transactions</a>
        <a href="{{ url_for('upload_blog') }}">Manage Blogs</a>
        <a href="{{ url_for('admin_reviews') }}">Manage Reviews</a>
    </div>

    <div class="main-content">
        <a href="{{ url_for('admin_logout') }}" class="btn btn-danger logout-btn">Logout</a>

        <div class="form-container">
            <h2>Upload Blog</h2>
            <form action="{{ url_for('upload_blog') }}" method="POST" enctype="multipart/form-data">
                <input type="text" name="title" placeholder="Blog Title" required>
                <textarea name="content" placeholder="Blog Content" required></textarea>
                <textarea name="additional_content" placeholder="Additional Content"></textarea>
                <input type="file" name="image" accept="image/*">
                <button type="submit">Upload Blog</button>
            </form>
        </div>

        <div class="blog-table mt-4">
            <h2>Manage Blogs</h2>
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Posted On</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for blog in blogs %}
                    <tr id="blog-{{ blog.id }}">
                        <td>{{ blog.title }}</td>
                        <td>{{ blog.created_at }}</td>
                        <td>
                            <button class="delete-btn" data-blog-id="{{ blog.id }}">Delete</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll(".delete-btn").forEach(button => {
                button.addEventListener("click", function() {
                    let blogId = this.getAttribute("data-blog-id");
    
                    if (confirm("Are you sure you want to delete this blog?")) {
                        fetch(`/admin/delete_blog/${blogId}`, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            }
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                alert(data.message);
                                document.getElementById(`blog-${blogId}`).remove();
                            } else {
                                alert("Error: " + data.message);
                            }
                        })
                        .catch(error => {
                            console.error("Fetch Error:", error);
                            alert("Request failed: " + error);
                        });
                    }
                });
            });
        });
    </script>

</body>
</html>
