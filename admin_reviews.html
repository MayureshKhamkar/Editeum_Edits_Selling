<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Reviews</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #121212;
            color: #fff;
        }
        .sidebar {
            width: 250px;
            position: fixed;
            height: 100%;
            background-color: #1e1e1e;
            padding-top: 20px;
        }
        .sidebar a {
            padding: 10px;
            text-decoration: none;
            font-size: 18px;
            color: #bbb;
            display: block;
        }
        .sidebar a:hover {
            background: #333;
            color: #fff;
        }
        .logout-btn {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .main-content {
            margin-left: 260px;
            padding: 20px;
        }
        .card {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            margin: auto;
        }
        .btn-success {
            background-color: red;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-success:hover {
            background-color: darkred;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin_users') }}">Manage Users</a>
        <a href="{{ url_for('admin_videos') }}">Manage Videos</a>
        <a href="{{ url_for('admin_transactions') }}">Transactions</a>
        <a href="{{ url_for('upload_blog') }}">Upload Blog</a>
        <a href="{{ url_for('admin_reviews') }}">Manage Reviews</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <a href="{{ url_for('admin_logout') }}" class="btn btn-danger logout-btn">Logout</a>
        <h2 class="text-center">Manage Reviews</h2>

        <!-- Post Review Form -->
        <div class="card bg-dark text-white p-4 mb-4">
            <h5>Post Admin Review</h5>
            <form action="{{ url_for('admin_reviews') }}" method="POST">
                <textarea class="form-control mb-3" name="review_text" rows="3" placeholder="Write a review..." maxlength="500" required></textarea>
                <button type="submit" class="btn btn-success">Upload Review</button>
            </form>
        </div>

        <!-- Reviews Table -->
        <div class="card bg-dark text-white p-4">
            <h5 class="mb-3">All Reviews</h5>
            <div class="table-responsive">
                <table class="table table-dark table-striped">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Review</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for review in reviews %}
                        <tr>
                            <td>{{ review.username }}</td>
                            <td>{{ review.review_text }}</td>
                            <td>
                                <form action="{{ url_for('admin_delete_review', review_id=review.id) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this review?');">
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3" class="text-center">No reviews found.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
