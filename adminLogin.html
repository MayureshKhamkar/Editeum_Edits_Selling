<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body {
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
        }
        .login-container {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            width: 380px;
            text-align: center;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.1);
        }
        .login-container h2 {
            color: darkred;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            height: 45px;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: darkred;
            box-shadow: 0px 0px 8px rgba(139, 0, 0, 0.6);
        }
        .btn {
            width: 100%;
            height: 50px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            background: darkred;
            color: white;
            transition: 0.3s;
        }
        .btn:hover {
            background: #b30000;
            transform: scale(1.03);
        }
        .go-back {
            position: absolute;
            top: 20px;
            right: 20px;
            background: darkred;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }
        .go-back:hover {
            background: #b30000;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <a href="{{ url_for('home') }}" class="go-back">Go Back</a>

    <div class="login-container">
        <h2>Admin Login</h2>
        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="input-group">
                <label for="email">Enter Email</label>
                <input type="email" name="email" placeholder="Admin Email" required>
            </div>
            <div class="input-group">
                <label for="password">Enter Password</label>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</body>
</html>
